[pytest]
testpaths = tests
# odl registers a pytest plugin ("odl_plugins") whose hooks use an argument
# name newer pytest versions reject, which aborts the whole run before any test
# is collected. The suite does not use it.
addopts = -p no:odl_plugins
# Silence PyTorch's beta-state notice for sparse CSR tensors. MatrixRadonAdapter
# builds its system matrices with torch.sparse_csr_tensor (src/radon.py), so
# this warning fires on nearly every operator test and only adds noise — it is
# not actionable from this codebase.
filterwarnings =
    ignore:Sparse CSR tensor support is in beta state:UserWarning
